<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Import KTM MyTelU ke JSON</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">

    <div class="max-w-4xl mx-auto space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-200">
            <h1 class="text-lg font-bold text-gray-800">Import Otomatis KTM MyTelU</h1>
            <p class="text-xs text-gray-500 mt-1 mb-4">Tempel link <code class="bg-gray-100 px-1.5 py-0.5 rounded text-[#B6252A]">show-ktm/...</code> atau masukkan <b>NIM</b> untuk mengambil data dari API MyTelU dan menyimpannya ke <code class="bg-gray-100 px-1.5 py-0.5 rounded">data_ktm.json</code>.</p>

            <form id="importForm" class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="ktm_url" required
                    placeholder="Tempel link show-ktm atau masukkan NIM (contoh: 109012630002)"
                    class="flex-1 px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:border-[#B6252A]">
                <button type="submit" id="submitBtn"
                    class="px-6 py-2.5 bg-[#B6252A] hover:bg-[#961d22] text-white font-semibold text-sm rounded-xl transition shrink-0">
                    Ambil & Simpan Data
                </button>
            </form>
            <p id="statusMsg" class="text-xs mt-3 font-medium hidden"></p>
            <pre id="debugBox" class="hidden mt-3 p-3 bg-gray-900 text-green-400 text-[11px] rounded-xl overflow-x-auto"></pre>
        </div>

        <div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold text-gray-600 uppercase tracking-wider">Data Tersimpan (data_ktm.json)</h2>
                <button onclick="loadSavedKTM()" class="text-xs text-[#B6252A] hover:underline font-medium">Refresh Data</button>
            </div>
            <div id="cardsContainer" class="grid md:grid-cols-2 gap-6"></div>
        </div>
    </div>

    <script>
        async function loadSavedKTM() {
            const container = document.getElementById('cardsContainer');
            try {
                const res = await fetch('scrape_ktm.php');
                const list = await res.json();

                if (!list.length) {
                    container.innerHTML = `<p class="text-sm text-gray-400">Belum ada data KTM tersimpan di data_ktm.json.</p>`;
                    return;
                }

                container.innerHTML = list.slice().reverse().map(item => `
                    <div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-200">
                        <div class="p-5 text-center bg-white">
                            <h3 class="text-lg font-extrabold text-gray-800">Universitas <span class="text-[#B6252A]">Telkom</span></h3>
                            <p class="text-[10px] text-gray-500 tracking-[0.25em] uppercase mt-2">${item.fakultas}</p>
                            <p class="text-xs font-semibold text-gray-700 mt-1.5">${item.prodi}</p>
                        </div>

                        <div class="bg-[#ED1E28] p-5 text-white flex gap-4 items-center">
                            <div class="w-16 h-16 rounded-full bg-white flex items-center justify-center shrink-0 overflow-hidden shadow">
                                ${item.photo 
                                    ? `<img src="${item.photo}" alt="Foto" class="w-full h-full object-cover">` 
                                    : `<span class="text-[#ED1E28] font-black text-base">Tel-U</span>`
                                }
                            </div>

                            <div class="space-y-1.5 text-xs w-full">
                                <div>
                                    <p class="text-[10px] text-white/80">Nama</p>
                                    <p class="font-bold uppercase text-sm leading-tight">${item.nama}</p>
                                </div>
                                <div>
                                    <p class="text-[10px] text-white/80">Nomor Induk Mahasiswa</p>
                                    <p class="font-bold">${item.nim}</p>
                                </div>
                                ${item.kelas ? `
                                <div>
                                    <p class="text-[10px] text-white/80">Kelas</p>
                                    <p class="font-bold">${item.kelas}</p>
                                </div>` : ''}
                                <div class="flex justify-between items-end pt-1">
                                    <div>
                                        <p class="text-[10px] text-white/80">Angkatan</p>
                                        <p class="font-bold">${item.angkatan}</p>
                                    </div>
                                    <div>
                                        <span class="bg-blue-500 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase">
                                            ${item.role}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `<p class="text-sm text-red-500">Gagal memuat data_ktm.json.</p>`;
            }
        }

        document.getElementById('importForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('statusMsg');
            const debugBox = document.getElementById('debugBox');
            const urlInput = document.getElementById('ktm_url');

            btn.disabled = true;
            btn.textContent = 'Mengambil Data...';
            msg.className = 'text-xs mt-3 font-medium text-gray-500 block';
            msg.textContent = 'Menghubungi API Telkom University...';
            debugBox.classList.add('hidden');

            try {
                const res = await fetch('scrape_ktm.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ktm_url: urlInput.value })
                });

                const result = await res.json();
                msg.textContent = result.message;
                msg.className = `text-xs mt-3 font-medium block ${result.status === 'success' ? 'text-green-600' : 'text-red-600'}`;

                if (result.api_response) {
                    debugBox.textContent = typeof result.api_response === 'string'
                        ? result.api_response
                        : JSON.stringify(result.api_response, null, 2);
                    debugBox.classList.remove('hidden');
                }

                if (result.status === 'success') {
                    urlInput.value = '';
                    loadSavedKTM();
                }
            } catch (err) {
                msg.textContent = 'Error: ' + err.message;
                msg.className = 'text-xs mt-3 font-medium text-red-600 block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Ambil & Simpan Data';
            }
        });

        loadSavedKTM();
    </script>
</body>
</html>
