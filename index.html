<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR KTM MyTelU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">

    <div class="max-w-4xl mx-auto space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-200">
            <h1 class="text-lg font-bold text-gray-800">Scan QR KTM MyTelU</h1>
            <p class="text-xs text-gray-500 mt-1 mb-4">Arahkan kamera ke QR KTM, atau pilih gambar QR dari galeri. Data akan diambil otomatis dari API MyTelU dan disimpan di browser (localStorage).</p>

            <div class="flex flex-col items-center gap-4">
                <div id="reader" class="w-full max-w-sm rounded-xl overflow-hidden bg-gray-900 hidden"></div>

                <div class="flex flex-wrap justify-center gap-3">
                    <button id="scanBtn"
                        class="px-6 py-2.5 bg-[#B6252A] hover:bg-[#961d22] text-white font-semibold text-sm rounded-xl transition">
                        Mulai Scan Kamera
                    </button>
                    <button id="fileBtn"
                        class="px-6 py-2.5 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold text-sm rounded-xl transition">
                        Upload Gambar QR
                    </button>
                    <input type="file" id="fileInput" accept="image/*" class="hidden">
                </div>
            </div>

            <p id="statusMsg" class="text-xs mt-4 font-medium hidden text-center"></p>
            <pre id="debugBox" class="hidden mt-3 p-3 bg-gray-900 text-green-400 text-[11px] rounded-xl overflow-x-auto"></pre>
        </div>

        <div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold text-gray-600 uppercase tracking-wider">Data Tersimpan</h2>
                <div class="flex gap-4">
                    <button onclick="downloadJSON()" class="text-xs text-[#B6252A] hover:underline font-medium">Unduh data_ktm.json</button>
                    <button onclick="loadSavedKTM()" class="text-xs text-[#B6252A] hover:underline font-medium">Refresh Data</button>
                </div>
            </div>
            <div id="cardsContainer" class="grid md:grid-cols-2 gap-6"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'data_ktm';
        const msg = document.getElementById('statusMsg');
        const debugBox = document.getElementById('debugBox');
        const readerEl = document.getElementById('reader');
        const scanBtn = document.getElementById('scanBtn');
        const fileBtn = document.getElementById('fileBtn');
        const fileInput = document.getElementById('fileInput');

        let qr = null;
        let scanning = false;
        let processing = false;

        function setStatus(text, type) {
            const color = { ok: 'text-green-600', err: 'text-red-600', info: 'text-gray-500' }[type] || 'text-gray-500';
            msg.className = `text-xs mt-4 font-medium text-center block ${color}`;
            msg.textContent = text;
        }

        async function readJson(res) {
            const text = await res.text();
            if (!text) return null;
            try { return JSON.parse(text); } catch { return null; }
        }

        function getLocal() {
            try {
                const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                return Array.isArray(d) ? d : [];
            } catch { return []; }
        }

        function saveLocal(record) {
            const list = getLocal();
            const i = list.findIndex(x => x.nim === record.nim);
            if (i >= 0) list[i] = record; else list.push(record);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        async function getAllData() {
            let seed = [];
            try {
                const res = await fetch('data_ktm.json', { cache: 'no-store' });
                if (res.ok) {
                    const d = await readJson(res);
                    if (Array.isArray(d)) seed = d;
                }
            } catch {}
            const map = new Map();
            seed.forEach(x => map.set(x.nim, x));
            getLocal().forEach(x => map.set(x.nim, x));
            return [...map.values()];
        }

        async function downloadJSON() {
            const list = await getAllData();
            const blob = new Blob([JSON.stringify(list, null, 4)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'data_ktm.json';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        async function loadSavedKTM() {
            const container = document.getElementById('cardsContainer');
            const list = await getAllData();

            if (!list.length) {
                container.innerHTML = `<p class="text-sm text-gray-400">Belum ada data KTM tersimpan.</p>`;
                return;
            }

            container.innerHTML = list.slice().reverse().map(item => `
                <div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-200">
                    <div class="p-5 text-center bg-white">
                        <h3 class="text-lg font-extrabold text-gray-800">Universitas <span class="text-[#B6252A]">Telkom</span></h3>
                        <p class="text-[10px] text-gray-500 tracking-[0.25em] uppercase mt-2">${item.fakultas || ''}</p>
                        <p class="text-xs font-semibold text-gray-700 mt-1.5">${item.prodi || ''}</p>
                    </div>

                    <div class="bg-[#ED1E28] p-5 text-white flex gap-4 items-center">
                        <div class="w-16 h-16 rounded-full bg-white flex items-center justify-center shrink-0 overflow-hidden shadow">
                            ${item.photo
                                ? `<img src="${item.photo}" alt="Foto" class="w-full h-full object-cover">`
                                : `<span class="text-[#ED1E28] font-black text-base">Tel-U</span>`
                            }
                        </div>

                        <div class="space-y-1.5 text-xs w-full">
                            <div>
                                <p class="text-[10px] text-white/80">Nama</p>
                                <p class="font-bold uppercase text-sm leading-tight">${item.nama}</p>
                            </div>
                            <div>
                                <p class="text-[10px] text-white/80">Nomor Induk Mahasiswa</p>
                                <p class="font-bold">${item.nim}</p>
                            </div>
                            ${item.kelas ? `
                            <div>
                                <p class="text-[10px] text-white/80">Kelas</p>
                                <p class="font-bold">${item.kelas}</p>
                            </div>` : ''}
                            <div class="flex justify-between items-end pt-1">
                                <div>
                                    <p class="text-[10px] text-white/80">Angkatan</p>
                                    <p class="font-bold">${item.angkatan || ''}</p>
                                </div>
                                <div>
                                    <span class="bg-blue-500 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase">
                                        ${item.role || ''}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Kirim hasil scan ke API
        async function processQR(decodedText) {
            if (processing) return;
            processing = true;
            debugBox.classList.add('hidden');
            setStatus('QR terbaca. Menghubungi API Telkom University...', 'info');

            try {
                const res = await fetch('/api/ktm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ktm_url: decodedText.trim() })
                });

                const result = await readJson(res);
                if (!result) {
                    throw new Error(`Server mengembalikan respons kosong/non-JSON (HTTP ${res.status}). Pastikan file api/ktm.js ikut ter-deploy.`);
                }

                setStatus(result.message, result.status === 'success' ? 'ok' : 'err');

                if (result.api_response) {
                    debugBox.textContent = typeof result.api_response === 'string'
                        ? result.api_response
                        : JSON.stringify(result.api_response, null, 2);
                    debugBox.classList.remove('hidden');
                }

                if (result.status === 'success' && result.data) {
                    saveLocal(result.data);
                    loadSavedKTM();
                }
            } catch (err) {
                setStatus('Error: ' + err.message, 'err');
            } finally {
                processing = false;
            }
        }

        async function stopScan() {
            if (qr && scanning) {
                try { await qr.stop(); } catch {}
            }
            scanning = false;
            readerEl.classList.add('hidden');
            scanBtn.textContent = 'Mulai Scan Kamera';
        }

        async function startScan() {
            if (!qr) qr = new Html5Qrcode('reader');
            readerEl.classList.remove('hidden');
            setStatus('Mengaktifkan kamera...', 'info');

            try {
                await qr.start(
                    { facingMode: 'environment' },
                    { fps: 10, qrbox: { width: 240, height: 240 } },
                    async (text) => {
                        await stopScan();
                        processQR(text);
                    },
                    () => {}
                );
                scanning = true;
                scanBtn.textContent = 'Stop Scan';
                setStatus('Arahkan kamera ke QR KTM.', 'info');
            } catch (err) {
                readerEl.classList.add('hidden');
                setStatus('Tidak bisa mengakses kamera: ' + (err.message || err) + '. Pastikan izin kamera diberikan, atau gunakan Upload Gambar QR.', 'err');
            }
        }

        scanBtn.addEventListener('click', () => scanning ? stopScan() : startScan());
        fileBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            await stopScan();
            if (!qr) qr = new Html5Qrcode('reader');
            setStatus('Membaca QR dari gambar...', 'info');
            try {
                const text = await qr.scanFile(file, false);
                await processQR(text);
            } catch {
                setStatus('QR tidak terdeteksi pada gambar. Coba gambar yang lebih jelas.', 'err');
            } finally {
                fileInput.value = '';
            }
        });

        loadSavedKTM();
    </script>
</body>
</html>
